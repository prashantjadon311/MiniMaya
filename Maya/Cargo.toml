[package]
name = "maya-mini"
version = "0.1.0"
edition = "2024"
authors = ["Maya Team"]
description = "Maya Mini v0.1: Supervised AI Coding Orchestrator & Lightweight Assistant"
publish = false

[lib]
name = "maya_mini"
path = "src/lib.rs"

[[bin]]
name = "maya-mini"
path = "src/main.rs"

[dependencies]
tokio = { version = "1.43", features = ["rt-multi-thread", "macros", "net", "time", "sync", "signal", "process", "io-util", "fs"] }
axum = { version = "0.8", features = ["tokio", "http1", "json"] }
tower = { version = "0.5", features = ["util"] }
tower-http = { version = "0.6", features = ["trace", "limit", "set-header"] }
rusqlite = { version = "0.33", features = ["bundled", "backup", "uuid", "chrono"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "json", "stream", "multipart"] }
futures-util = "0.3"
tokio-util = { version = "0.7", features = ["io"] }
bytes = "1.10"
chrono = { version = "0.4", features = ["serde"] }
chrono-tz = { version = "0.10", features = ["serde"] }
uuid = { version = "1.15", features = ["v4", "serde"] }
sha2 = "0.10"
hex = "0.4"
rand = "0.9"
base64 = "0.22"
subtle = "2.6"
keyring = { version = "3.6", features = ["linux-native"] }
zeroize = { version = "1.8", features = ["derive", "zeroize_derive"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
thiserror = "2.0"
url = { version = "2.5", features = ["serde"] }
mime = "0.3"
percent-encoding = "2.3"
rustix = { version = "1.0", features = ["fs", "process", "time", "event", "net"] }
tokio-tungstenite = { version = "0.26", features = ["rustls-tls-webpki-roots"] }
zbus = { version = "5.5", default-features = false, features = ["tokio"] }
tempfile = "3.17"

[dev-dependencies]
tempfile = "3.17"
http-body-util = "0.1"

[profile.release]
lto = "thin"
codegen-units = 1
panic = "unwind"
